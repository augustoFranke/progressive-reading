name: progressive-reading

services:
  progressive-reading:
    build:
      context: ../..
    container_name: progressive-reading
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PROGRESSIVE_READING_CACHE_DIR: /data
    volumes:
      - /srv/data/progressive-reading:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
