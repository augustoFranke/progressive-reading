name: ProgressiveReading
options:
  bundleIdPrefix: com.augustofranke
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    DEVELOPMENT_TEAM: PH9638G866
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    INFOPLIST_KEY_CFBundleVersion: "1"
    INFOPLIST_KEY_CFBundleShortVersionString: "1.0"

targets:
  ProgressiveReading:
    type: application
    platform: iOS
    sources:
      - path: ProgressiveReading
    dependencies:
      - target: ReadingWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augustofranke.progressivereading
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "Progressive Reading"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  ReadingWidgetExtension:
    type: app-extension
    platform: iOS
    info:
      path: ReadingWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: ReadingWidget
      - path: ProgressiveReading/Models
      - path: ProgressiveReading/Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augustofranke.progressivereading.widget
        GENERATE_INFOPLIST_FILE: true
